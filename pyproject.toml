[project]
name = "loadbalancer"
version = "0.1.0"
description = "Async load balancer for vLLM/llama.cpp instances based on /metrics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "watchdog>=6.0.0",
]

[project.scripts]
loadbalancer = "vllm_lb.main:run"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# the distribution is called `loadbalancer`, the import package `vllm_lb`
module-name = "vllm_lb"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
